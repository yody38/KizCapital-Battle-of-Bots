name: mcp-health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [mcp-health]

permissions:
  contents: read
  issues: write

concurrency:
  group: mcp-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          # 2026-09-08: `umask 077` ANTES de escribir. Con `echo > archivo` seguido
          # de `chmod 600` la clave privada existia unos milisegundos con permisos
          # 644, legible por cualquier otro proceso del runner. Mismo patron que
          # ya usa refresh.yml para .env.local.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          umask 077
          cat > ~/.ssh/id_ed25519_ci <<'EOF_KEY'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF_KEY
          chmod 600 ~/.ssh/id_ed25519_ci

      - name: Tailscale up
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Restore mcp-health state
        uses: actions/cache/restore@v4
        with:
          path: data/mcp_health_state.json
          key: mcp-health-state-${{ github.run_id }}
          restore-keys: |
            mcp-health-state-

      - name: Probe MCP health
        env:
          SSH_KEY: /home/runner/.ssh/id_ed25519_ci
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_RECOVERY: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/mcp_health.py

      - name: Save mcp-health state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/mcp_health_state.json
          key: mcp-health-state-${{ github.run_id }}

      - name: Redact topology before uploading the artifact
        if: always()
        run: |
          # 2026-09-08: el repo es PUBLICO y los artifacts de un run los descarga
          # cualquiera que tenga la URL del run. data/mcp_health.json lleva el
          # campo `host` de cada VPS (direcciones Tailscale de las 6 maquinas),
          # asi que se sube una copia redactada: fuera cualquier clave que sea
          # ip/host/direccion, a cualquier nivel de anidamiento.
          # mcp_health_state.json solo tiene contadores por vps_id — no se toca.
          python3 - <<'PYEOF'
          import json, pathlib, re

          src = pathlib.Path("data/mcp_health.json")
          dst = pathlib.Path("data/mcp_health.public.json")
          if not src.exists():
              raise SystemExit(0)

          SENSIBLE = re.compile(r"ip|host|addr|tailscale", re.IGNORECASE)

          def limpiar(obj):
              if isinstance(obj, dict):
                  return {k: limpiar(v) for k, v in obj.items() if not SENSIBLE.search(str(k))}
              if isinstance(obj, list):
                  return [limpiar(v) for v in obj]
              return obj

          dst.write_text(json.dumps(limpiar(json.loads(src.read_text())), indent=2))
          print("mcp_health.public.json escrito (topologia redactada)")
          PYEOF

      - name: Upload health artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-health-${{ github.run_id }}
          path: |
            data/mcp_health.public.json
            data/mcp_health_state.json
          if-no-files-found: warn
          retention-days: 7
