name: sampler-tick

# Interim driver for equity_sampler.py (tribunal 2026-06-09, Fase A canary).
# Pattern: gh-actions-ssh-tick-loop — each run loops ~27 min of one-shot SSH
# ticks at TICK_SECS cadence; cron re-schedules with overlap so coverage
# survives GH cron throttling. Target architecture is the Railway
# kiz-live-bridge worker (pull SSH); migrate this loop there once Railway
# auth is restored, then disable this workflow.

# REVIVIDO 2026-08-04: el driver Railway nunca quedó activo y el sampler llevaba
# MUERTO en toda la flota desde el 2026-07-28 (sampler_status.json de vps1:
# last_sample 07-28). Cron */25 con LOOP_MINUTES=27 — el MISMO patrón que
# live-publisher-tick.yml lleva corriendo en producción sin duplicados (el lock
# local del sampler, LOCK_STALE_SECS=300, absorbe cualquier solape breve).
# Si Railway vuelve como single-writer: quitar este cron, no el workflow.
on:
  schedule:
    - cron: "*/25 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [sampler-tick]

concurrency:
  group: sampler-tick
  cancel-in-progress: true     # exactly one active loop; a fresh run supersedes

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      # Flota 2026-08-04: vps1 (canary original) + vps4 + vps6 (RAM medida: 660/710
      # MB libres; el tick usa ~29 MB transitorios). DIFERIDOS por RAM bajo el
      # umbral de la skill vps-trading-safe-access: vps2 (110 MB) y vps5 (40 MB).
      # vps3 (reales) diferido además hasta que Yody declare initial_balances.json
      # — sin denominador declarado el DD% de las reales saldría inventado.
      VPS_HOSTS: "100.118.159.44 100.101.9.46 100.112.112.115"
      TICK_SECS: "120"
      LOOP_MINUTES: "27"

    steps:
      - name: Setup SSH key
        run: |
          # 2026-09-08: `umask 077` ANTES de escribir. Con `echo > archivo` seguido
          # de `chmod 600` la clave privada existia unos milisegundos con permisos
          # 644, legible por cualquier otro proceso del runner. Mismo patron que
          # ya usa refresh.yml para .env.local.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          umask 077
          cat > ~/.ssh/id_ed25519_ci <<'EOF_KEY'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF_KEY
          chmod 600 ~/.ssh/id_ed25519_ci

      - name: Tailscale up
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Tick loop
        run: |
          # 2026-09-08: contadores ok/fail y `exit 1` al final. Antes el ultimo
          # comando del ciclo era `... || true`, asi que el paso salia 0 SIEMPRE:
          # el sampler podia estar muerto en toda la flota durante 27 min y el run
          # se veia verde — exactamente como paso entre 2026-07-28 y 2026-08-04.
          # La cadencia del loop no cambia: solo se cuenta y se decide al salir.
          ok=0
          fail=0
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            t0=$(date +%s)
            for host in $VPS_HOSTS; do
              if out=$(ssh -i ~/.ssh/id_ed25519_ci \
                    -o StrictHostKeyChecking=accept-new \
                    -o ConnectTimeout=10 -o ServerAliveInterval=10 \
                    "trader@${host}" \
                    "C:\\mt5-mcp\\venv\\Scripts\\python.exe C:\\mt5-mcp\\equity_sampler.py --once --cadence ${TICK_SECS}" \
                    2>&1); then
                echo "[$host] $out"
                ok=$(( ok + 1 ))
              else
                echo "[$host] TICK-FAIL: $out"
                fail=$(( fail + 1 ))
              fi
            done
            elapsed=$(( $(date +%s) - t0 ))
            sleep_for=$(( TICK_SECS - elapsed ))
            [ "$sleep_for" -gt 0 ] && sleep "$sleep_for" || true
          done
          total=$(( ok + fail ))
          echo "TICK-SUMMARY ok=$ok fail=$fail"
          if [ "$total" -eq 0 ]; then
            echo "TICK-VERDICT: el loop no llego a intentar ni un tick"
            exit 1
          fi
          if [ "$ok" -eq 0 ]; then
            echo "TICK-VERDICT: cero ticks exitosos"
            exit 1
          fi
          if [ $(( fail * 2 )) -ge "$total" ]; then
            echo "TICK-VERDICT: fallos >= 50% de los intentos"
            exit 1
          fi
